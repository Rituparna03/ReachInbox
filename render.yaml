# Render Blueprint: New > Blueprint > point at this repo.
# NOTE: the web service must be an always-on paid instance (not free) so the BullMQ worker never sleeps.
databases:
  - name: scheduler-db
    plan: basic-256mb          # free Postgres expires; use a paid plan for anything real
    databaseName: scheduler
    user: scheduler

services:
  - type: keyvalue             # Redis-compatible, used by BullMQ
    name: scheduler-redis
    plan: starter
    maxmemoryPolicy: noeviction   # REQUIRED by BullMQ: eviction would silently delete jobs
    ipAllowList: []               # internal network only

  - type: web
    name: reachinbox-scheduler-api
    runtime: node
    plan: starter              # always-on. Free tier sleeps after 15 min idle => delayed jobs would NOT fire.
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - { key: NODE_VERSION, value: 20 }
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, fromDatabase: { name: scheduler-db, property: connectionString } }
      - { key: REDIS_URL, fromService: { type: keyvalue, name: scheduler-redis, property: connectionString } }
      - { key: JWT_SECRET, generateValue: true }
      - { key: BULL_BOARD_PASS, generateValue: true }
      - { key: BULL_BOARD_USER, value: admin }
      - { key: FRONTEND_URL, sync: false }       # https://<project>.vercel.app
      - { key: BACKEND_URL, sync: false }        # same Vercel URL (OAuth callbacks go through the proxy)
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: SLACK_CLIENT_ID, sync: false }
      - { key: SLACK_CLIENT_SECRET, sync: false }
      - { key: ELASTICSEARCH_URL, sync: false }  # optional (Elastic Cloud / Bonsai); blank => SQL fallback
      - { key: ELASTICSEARCH_API_KEY, sync: false }
      - { key: WORKER_CONCURRENCY, value: 5 }
      - { key: MIN_DELAY_BETWEEN_SENDS_MS, value: 2000 }
      - { key: MAX_EMAILS_PER_HOUR_PER_SENDER, value: 200 }
      - { key: SENDERS_PER_USER, value: 2 }
